{% extends "base.html" %}
{% block title %}管理后台 - 登录 - {% endblock %}
{% block content %}
<style>
    .login-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    .login-box h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; color: #1a3a5c; }
</style>
<section class="section login-page">
    <div class="login-box">
        <h1>⚖ 管理后台</h1>
        <form method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入管理员用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
        <div style="text-align:center;margin-top:1rem;font-size:.85rem;color:#999;">
            <a href="/">← 返回首页</a>
        </div>
    </div>
</section>
{% endblock %}

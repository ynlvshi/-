# Nginx 配置 - lawyer01.com
# 放至 /etc/nginx/sites-available/lawyer01.com

server {
    listen 80;
    server_name lawyer01.com www.lawyer01.com;

    # 网站根目录（静态文件）
    root /var/www/ynlawyers/static;

    # 日志
    access_log /var/log/nginx/ynlawyers-access.log;
    error_log  /var/log/nginx/ynlawyers-error.log;

    # 客户端上传大小限制
    client_max_body_size 10M;

    # 静态文件直接返回，带缓存
    location /static/ {
        alias /var/www/ynlawyers/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件
    location /static/uploads/ {
        alias /var/www/ynlawyers/static/uploads/;
        expires 7d;
    }

    # 所有其他请求转发到 Flask (Waitress)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 让 Let's Encrypt 验证通过
    location /.well-known/acme-challenge/ {
        root /var/www/ynlawyers/static;
    }
}
